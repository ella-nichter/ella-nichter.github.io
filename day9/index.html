<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garnet Gameday Checklist</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="checklist-card">
    <header>
      <p class="eyebrow">Saturday in South Carolina</p>
      <h1>Gamecock <em>Gameday</em></h1>
      <p class="subtitle">
            Checklist!   
     </p>
    </header>

    <section class="add-task" aria-label="Add a checklist item">
      <label for="new-item">What’s on the agenda?</label>

      <div class="input-row">
        <input type="text" id="new-item" placeholder="Ex: Pack clear bag">

        <button id="add-button" type="button">
          Add it <span aria-hidden="true">✦</span>
        </button>
      </div>
    </section>

    <section class="list-section">
      <div class="list-heading">
        <h2>Today’s lineup</h2>
        <span id="task-count">0 things to do</span>
      </div>

      <ul id="checklist" aria-live="polite"></ul>

      <p id="empty-message">
        Willy-B Awaits!
      </p>
    </section>

    <button id="clear-completed" class="clear-button" type="button">
      Clear completed
    </button>
  </main>

  <script src="script.js"></script>
</body>
</html>
