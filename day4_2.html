<!--All of these things must be included every time: DOCTYPE, HTML lang=en, body-->
<!DOCTYPE html>

<html lang="en">
    <head>
        <Title>Form Example Day 4</Title>
    </head>
    <body>
        <h2>Project Submission</h2>
<!--PARAMETERS FOR THE FORM inside the forms thingy-->
        <form action="/example.html" method="POST">

            <div>
                <label for="studentName">Full Name:</label>
                <input type="text" id="studentName" required/>
            </div>
            <br>

            <div>
                <label for="studentEmail">University Email:</label>
                <input type="email" is="studentEmail" required/>
            </div>
            <br>
            
            <button type="submit">Submit Project</button>
        </form>
    </body>
</html>
