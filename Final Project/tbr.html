<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My TBR | The Reading Nook</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>The Reading Nook</h1>

        <nav>
            <a href="home.html">Home</a>
            <a href="tbr.html">My TBR</a>
            <a href="picker.html">Book Picker</a>
            <a href="stats.html">Stats</a>
        </nav>
    </header>

    <main>
        <section id="tbr-welcome-section">
            <h2>My To Be Read List</h2>
            <p>New Worlds Await.</p>
        </section>

        <section id="add-book-section">
            <h3>Add a New Book</h3>

            <label for="book-title-input">Book Title</label>
            <input type="text" id="book-title-input" placeholder="Enter book title">

            <label for="book-author-input">Author</label>
            <input type="text" id="book-author-input" placeholder="Enter author name">

            <label for="book-genre-input">Genre</label>
            <input type="text" id="book-genre-input" placeholder="Enter genre">

            <button id="add-book-button" onclick="addBook()">
                Add to My TBR
            </button>
        </section>

        <section id="tbr-list-section">
            <div id="tbr-list-heading">
                <h3>My Books</h3>

                <p>
                    You have <span id="tbr-count">0</span> books on your TBR.
                </p>
            </div>

            <div class="book-list-labels">
                <p>Finished?</p>
                <p>Title</p>
                <p>Author</p>
                <p>Genre</p>
            </div>

            <ul id="tbr-list">
                <!-- JavaScript will add TBR books here. -->
            </ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
