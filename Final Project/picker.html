<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Picker | The Reading Nook</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>The Reading Nook</h1>

        <nav>
            <a href="home.html">Home</a>
            <a href="tbr.html">My TBR</a>
            <a href="picker.html">Book Picker</a>
            <a href="stats.html">Stats</a>
        </nav>
    </header>

    <main>
        <section id="picker-welcome-section">
            <h2>What are you in the mood to read today?</h2>
            <p>Choose a genre and a vibe, then let the nook choose your next story.</p>
        </section>

        <section id="genre-section">
            <h3>Choose a Genre</h3>

            <div class="button-group">
                <button class="genre-button" onclick="chooseGenre('Romance', this)">Romance</button>
                <button class="genre-button" onclick="chooseGenre('Thriller', this)">Thriller</button>
                <button class="genre-button" onclick="chooseGenre('Fantasy', this)">Fantasy</button>
                <button class="genre-button" onclick="chooseGenre('Mystery', this)">Mystery</button>
                <button class="genre-button" onclick="chooseGenre('Science Fiction', this)">Sci-Fi</button>
                <button class="genre-button" onclick="chooseGenre('Romantasy', this)">Romantasy</button>
            </div>
        </section>

        <section id="vibe-section">
            <h3>Choose a Vibe</h3>

            <div class="button-group">
                <button class="vibe-button" onclick="chooseVibe('Cozy', this)">Cozy</button>
                <button class="vibe-button" onclick="chooseVibe('Classic', this)">Classic</button>
                <button class="vibe-button" onclick="chooseVibe('Fall in Love', this)">Fall in Love</button>
                <button class="vibe-button" onclick="chooseVibe('High Stakes', this)">High Stakes</button>
                <button class="vibe-button" onclick="chooseVibe('New Worlds', this)">New Worlds</button>
            </div>
        </section>

        <button id="generate-button" onclick="generateRecommendation()">
            Generate Recommendation
        </button>

        <section id="recommendation-section">
            <h3>Your Recommendation</h3>

            <div id="recommendation-card">
                <div class="recommendation-cover">
                   <img
                        id="recommendation-cover-image"
                        src=""
                        alt=""
>
                </div>

                <div id="recommendation-information">
                    <h4 id="recommendation-title">Choose a genre and vibe</h4>
                    <p id="recommendation-author">Your recommendation will appear here.</p>
                    <p id="recommendation-genre"></p>
                </div>
            </div>

            <button id="new-recommendation-button" onclick="generateRecommendation()">
                New Recommendation
            </button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
