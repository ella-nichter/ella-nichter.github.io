<!DOCTYPE html>
<html lang="en">
<head>
    <title>Bank Account</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="account-card">
        <p class="account-balance">Move Money</p>
        <h2>Account Balance</h2>

        <p id="money-display">Current Balance: $100</p>
        <p id="status-message">Deposit or withdraw money.</p>

        <button id="deposit-button" onclick="deposit()">Deposit $5</button>
        <button id="withdraw-button" onclick="withdraw()">Withdraw $5</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
