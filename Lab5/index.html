<!DOCTYPE html>
<html lang="en">
<head>
    <title>Bank Account</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="account-card">
        <p class="account-balance">Account Balance</p>
        <h2>Move Money</h2>

        <p class="money-label">$</p>
        <p id="money-display">100</p>

        <p id="status-message">Deposit or Withdraw</p>

        <button onclick="Deposit()">Deposit Here</button>
        <button onclick="Withdraw()">Withdraw Here</button>

    </div>

    <script src="script.js"></script>
</body>
</html>
